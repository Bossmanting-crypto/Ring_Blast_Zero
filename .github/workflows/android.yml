name: Build Wear OS App Bundle

# Produces:
#   ring-blast-zero-wear-aab -> app-release.aab for the Play Wear OS track
#   ring-blast-zero-wear-apk -> app-debug.apk to sideload onto a watch over ADB
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Must be the SAME key the phone app is signed with — both ship under one listing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'versionCode (must exceed the phone build and the last upload)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Bump versionCode
        if: github.event.inputs.versionCode != ''
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.event.inputs.versionCode }}/" app/build.gradle.kts
          grep -n "versionCode" app/build.gradle.kts

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret. Building UNSIGNED — Play will reject this bundle."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "Keystore written ($(stat -c%s upload-keystore.jks) bytes)"

      - name: Build release bundle
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Report signing state
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "Bundle: $AAB ($(du -h "$AAB" | cut -f1))"
          if unzip -l "$AAB" | grep -qE "META-INF/.*\.(RSA|EC|DSA)"; then
            echo "Signed — ready for the Wear OS track."
          else
            echo "::warning::Bundle is UNSIGNED. Add the four keystore secrets and re-run."
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ring-blast-zero-wear-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ring-blast-zero-wear-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Clean up signing files
        if: always()
        run: rm -f upload-keystore.jks keystore.properties
